<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DF-LAB · 数字色卡库</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#0a0a08;color:#c4bfb3;line-height:1.4;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:10;background:#0a0a08;padding:14px 16px 10px;border-bottom:1px solid #1a1a18}
.topbar .logo{font-size:15px;font-weight:700;letter-spacing:1px;color:#c4a882;margin-bottom:10px}
.topbar .search{display:flex;gap:8px}
.topbar .search input{flex:1;padding:10px 14px;background:#141412;border:1px solid #2a2824;border-radius:10px;color:#e8e4dc;font-size:14px;outline:none}
.topbar .search input:focus{border-color:#c4a882}
.topbar .search input::placeholder{color:#555}
.tags{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;-ms-overflow-style:none}
.tags::-webkit-scrollbar{display:none}
.tags span{flex-shrink:0;padding:7px 15px;border-radius:20px;font-size:12px;border:1px solid #2a2824;color:#888;cursor:pointer;transition:all .15s;white-space:nowrap}
.tags span.on,.tags span:active{color:#c4a882;border-color:#c4a882;background:rgba(196,168,130,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 16px 100px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.card{background:#141412;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;border:1px solid #1a1a18}
.card:active{transform:scale(.97)}
.card .sw{aspect-ratio:1;display:flex;align-items:flex-end;justify-content:flex-end;background-size:cover!important;background-position:center!important;padding:8px}
.card .sw .code{font-size:9px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.35);padding:2px 6px;border-radius:3px}
.card .info{padding:10px 12px 12px}
.card .info .name{font-size:13px;font-weight:600;color:#e8e4dc;margin-bottom:2px}
.card .info .meta{font-size:10px;color:#666}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;overflow-y:auto}
.overlay.on{display:block}
.modal{min-height:100vh;padding-bottom:40px}
.modal .ms{height:50vh;min-height:280px;display:flex;align-items:center;justify-content:center;background-size:cover!important;background-position:center!important;position:relative}
.modal .ms .close{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#ccc;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal .ms .tag{position:absolute;bottom:16px;left:16px;padding:5px 12px;background:rgba(0,0,0,.55);color:#c4a882;font-size:11px;border-radius:6px}
.modal .mb{padding:20px 16px}
.modal .mb h3{font-size:22px;font-weight:600;color:#e8e4dc;margin-bottom:16px}
.modal .mb .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a18;font-size:13px}
.modal .mb .row .l{color:#666}.modal .mb .row .v{color:#e8e4dc}
.modal .ma{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.modal .ma .btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.modal .ma .pri{background:#c4a882;color:#0a0a08;border:none}
.modal .ma .sec{background:transparent;border:1px solid #333;color:#888}
.wx-panel{text-align:center;padding:32px 16px}
.wx-panel h3{font-size:20px;color:#e8e4dc;margin-bottom:20px}
.wx-panel .wx-btn{display:block;width:100%;max-width:320px;margin:0 auto 16px;padding:14px;background:#c4a882;color:#0a0a08;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.wx-panel .wx-qr{width:180px;height:180px;margin:12px auto;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.wx-panel .wx-close{background:none;border:none;color:#666;font-size:13px;cursor:pointer;margin-top:8px}
.ft{text-align:center;padding:28px 16px;font-size:10px;color:#444}
.ft span{color:#5a4a34}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#444;font-size:13px}
</style>
</head>
<body>
<div class="topbar"><div class="logo">DF-LAB · 数字色卡库</div><div class="search"><input type="text" id="sr" placeholder="搜索品种 / 色号" oninput="fl()"></div></div>
<div class="tags" id="tags"><span class="on" onclick="fa(this)">全部</span></div>
<div class="grid" id="gd"><div class="empty">加载中...</div></div>

<div class="overlay" id="ov"><div class="modal"><div class="ms" id="ms"><button class="close" onclick="document.getElementById('ov').classList.remove('on')">✕</button><div class="tag" id="mtag"></div></div><div class="mb" id="mb"></div><div class="ma"><button class="btn pri" onclick="od()">我要定制这个颜色</button><button class="btn sec" onclick="document.getElementById('ov').classList.remove('on')">返回</button></div></div></div>

<div class="overlay" id="wx"><div class="wx-panel"><h3>联系DF-LAB定制</h3><button class="wx-btn" onclick="window.open('weixin://')">有微信 · 点此发消息</button><p style="color:#666;font-size:12px;margin:8px 0">或扫码添加</p><div class="wx-qr">微信二维码</div><button class="wx-close" onclick="document.getElementById('wx').classList.remove('on')">关闭</button></div></div>

<div class="ft"><span>上海 · DF-LAB</span> 木皮色彩实验室</div>

<script>
var GH='https://raw.githubusercontent.com/dert75604-a11y/dflab-color-library/main/color-library.json';
var DEF=[{name:'烟熏橡木',code:'F-3080',finish:'哑光开放',color:'#8b7355',image:null,uploader:'DF-LAB',tags:['橡木','烟熏','开放漆']},{name:'黑胡桃山纹',code:'F-3061',finish:'哑光开放',color:'#5c4033',image:null,uploader:'DF-LAB',tags:['胡桃','开放漆']},{name:'柚木直纹',code:'F-3071',finish:'哑光开放',color:'#b8956a',image:null,uploader:'DF-LAB',tags:['柚木','开放漆']},{name:'白橡混拼',code:'F-3051',finish:'哑光开放',color:'#d4c5b2',image:null,uploader:'DF-LAB',tags:['橡木','开放漆']},{name:'榆木半山',code:'F-3031',finish:'哑光开放',color:'#c4a882',image:null,uploader:'DF-LAB',tags:['榆木','开放漆']},{name:'烟熏尤加利',code:'F-3081',finish:'哑光开放',color:'#6b5b4f',image:null,uploader:'DF-LAB',tags:['烟熏','开放漆']},{name:'桧木直纹',code:'F-3082',finish:'哑光开放',color:'#e8d5b7',image:null,uploader:'DF-LAB',tags:['开放漆']},{name:'黑檀',code:'G-3049',finish:'哑光开放',color:'#2a1f1a',image:null,uploader:'DF-LAB',tags:['开放漆']},{name:'混油纯白',code:'V1-W',finish:'哑光封闭',color:'#f5f0e8',image:null,uploader:'DF-LAB',tags:['哑光']},{name:'混油暖灰',code:'V1-G',finish:'哑光封闭',color:'#c4bfb3',image:null,uploader:'DF-LAB',tags:['哑光']},{name:'锯齿橡木',code:'F-3047',finish:'哑光开放',color:'#9a8b7a',image:null,uploader:'DF-LAB',tags:['橡木','开放漆']},{name:'胡桃直纹',code:'F-3063',finish:'哑光开放',color:'#4a3528',image:null,uploader:'DF-LAB',tags:['胡桃','开放漆']},{name:'桦木山纹',code:'F-3072',finish:'哑光开放',color:'#e8ddcc',image:null,uploader:'DF-LAB',tags:['开放漆']}];
var AD=[],CT=null;

function buildTags(d){var set={},el=document.getElementById('tags');for(var i=0;i<d.length;i++){var t=d[i].tags||[];for(var j=0;j<t.length;j++)set[t[j]]=1;}var keys=Object.keys(set).sort();el.innerHTML='<span class="on" onclick="fa(this)">全部</span>';for(var k=0;k<keys.length;k++){el.innerHTML+='<span onclick="ft(this,\''+keys[k]+'\')">'+keys[k]+'</span>';}}

function rn(d){if(!d)d=AD;var h='';for(var i=0;i<d.length;i++){var x=d[i],bg='';if(x.image)bg='background-image:url('+x.image+');';h+='<div class="card" onclick="op('+i+')"><div class="sw" style="background-color:'+(x.color||'#555')+';'+bg+'background-size:cover;background-position:center"><span class="code">'+x.code+'</span></div><div class="info"><div class="name">'+x.name+'</div><div class="meta">'+x.finish+' · '+x.uploader+'</div></div></div>';}document.getElementById('gd').innerHTML=h||'<div class="empty">暂无数据</div>';}

function fl(){var q=document.getElementById('sr').value.toLowerCase(),d=AD.slice();if(CT)d=d.filter(function(x){return x.tags&&x.tags.indexOf(CT)>=0;});if(q)d=d.filter(function(x){return (x.name||'').toLowerCase().indexOf(q)>=0||(x.code||'').toLowerCase().indexOf(q)>=0;});rn(d);}
function fa(btn){var bs=document.querySelectorAll('#tags span');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');btn.classList.add('on');CT=null;fl();}
function ft(btn,tag){var bs=document.querySelectorAll('#tags span');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');btn.classList.add('on');CT=tag;fl();}
function op(i){var d=AD[i],bg=d.image?'background-image:url('+d.image+');':'';document.getElementById('ms').style.cssText='background-color:'+(d.color||'#555')+';'+bg+'background-size:cover;background-position:center';document.getElementById('mtag').textContent=d.code+' · '+d.name;document.getElementById('mb').innerHTML='<h3>'+d.name+'</h3><div class="row"><span class="l">色号</span><span class="v">'+d.code+'</span></div><div class="row"><span class="l">表面处理</span><span class="v">'+d.finish+'</span></div><div class="row"><span class="l">上传者</span><span class="v">'+d.uploader+'</span></div>';document.getElementById('ov').classList.add('on');}
function od(){document.getElementById('ov').classList.remove('on');document.getElementById('wx').classList.add('on');}

var local=localStorage.getItem('dflab_color_library');
if(local){try{AD=JSON.parse(local);buildTags(AD);rn();}catch(e){}}
var xhr=new XMLHttpRequest();xhr.open('GET',GH,true);xhr.onload=function(){if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);if(d&&d.length&&!AD.length){AD=d;buildTags(AD);rn();}}catch(e){}}if(!AD.length){AD=DEF.slice();buildTags(AD);rn();}};xhr.onerror=function(){if(!AD.length){AD=DEF.slice();buildTags(AD);rn();}};xhr.send();
</script>
</body>
</html>
